# Distributed key-value store: up to three stores behind one router.
#
# Start N stores by naming them, and tell the router which ones exist (example: two stores):
#   STORE_URLS=http://store1:8080,http://store2:8080 docker compose up -d --build store1 store2 router
# Run the benchmark inside the same Docker network:
#   docker compose run --rm bench --url http://router:8000 --stores 2
# Stop everything and delete all data:
#   docker compose down -v

x-store: &store                 # settings shared by all three stores
  build: .
  image: kv-store
  pull_policy: build            # always build our own image; never look for it on Docker Hub
  healthcheck:                  # "healthy" once GET / answers
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/')"]
    interval: 2s
    timeout: 2s
    retries: 15

services:
  store1:
    <<: *store
    command: ["python", "server.py", "--host", "0.0.0.0", "--port", "8080", "--node-id", "store1"]
    ports: ["8081:8080"]        # reachable from your Mac at localhost:8081, for checks
    volumes: ["store1-data:/app/data"]

  store2:
    <<: *store
    command: ["python", "server.py", "--host", "0.0.0.0", "--port", "8080", "--node-id", "store2"]
    ports: ["8082:8080"]
    volumes: ["store2-data:/app/data"]

  store3:
    <<: *store
    command: ["python", "server.py", "--host", "0.0.0.0", "--port", "8080", "--node-id", "store3"]
    ports: ["8083:8080"]
    volumes: ["store3-data:/app/data"]

  router:
    build: .
    image: kv-store
    pull_policy: build
    command: ["python", "router.py", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      STORE_URLS: ${STORE_URLS:-http://store1:8080}   # which stores the hash ring uses
    ports: ["8000:8000"]
    depends_on:
      store1:
        condition: service_healthy

  bench:                        # only runs when asked: docker compose run --rm bench ...
    build: .
    image: kv-store
    pull_policy: build
    profiles: ["tools"]
    entrypoint: ["python", "benchmark.py"]
    volumes: ["./benchmark_results:/app/benchmark_results"]

volumes:                        # one separate, persistent volume per store
  store1-data:
  store2-data:
  store3-data: